name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # The generated C# built and tested with the .NET SDK: the build tests
  # (CBOR and JSON, every reference schema) and the interop vectors.
  csharp:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    - name: Build
      run: cargo build
    - name: C# build tests (CBOR and JSON)
      # A schema whose tools are missing is skipped, not failed: check that
      # none was, so a missing dotnet can't pass.
      run: |
        set -o pipefail
        cargo test -p backend-buildtest --test build_validation test_build_csharp -- --ignored --nocapture 2>&1 | tee build.log
        grep -E '^  C#: [0-9]+ built, 0 skipped, 0 failed' build.log
        grep -E '^  C# JSON: [0-9]+ built, 0 skipped, 0 failed' build.log
    - name: C# interop vectors
      run: scripts/interop-csharp.sh
