name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # `labeled` / `unlabeled`: adding or removing the `release` label changes
    # whether a registry outage blocks the PR (CDDLC_REQUIRE_REGISTRIES below).
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # The generated code for each language, built and tested with that
  # language's own toolchain: every reference schema, in each format the
  # backend writes (crates/backend-buildtest).
  build-tests:
    name: build tests (${{ matrix.lang }})

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - lang: rust
          tests: test_build_rust test_build_rust_no_std test_build_rust_json
        - lang: c
          tests: test_build_c test_build_c_json
        - lang: cpp
          tests: test_build_cpp test_build_cpp_json
        - lang: csharp
          tests: test_build_csharp test_build_csharp_json
        - lang: nodejs
          tests: test_build_nodejs
        - lang: python
          tests: test_build_python test_build_python_json
        - lang: go
          tests: test_build_go test_build_go_json
        - lang: java
          tests: test_build_java test_build_java_json test_build_java_ee test_build_java_ee_json
        - lang: lua
          tests: test_build_lua test_build_lua_json
        - lang: dart
          tests: test_build_dart test_build_dart_json

    env:
      # A schema whose toolchain is missing fails instead of being skipped.
      CDDLC_REQUIRE_TOOLS: '1'
      # A release PR (release-plz's `release-plz-*` branch, or the `release`
      # label) must test every schema: a package registry that stays
      # unavailable fails it. On any other PR an outage is only a warning, so
      # it doesn't block the merge.
      CDDLC_REQUIRE_REGISTRIES: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release-plz-') || contains(github.event.pull_request.labels.*.name, 'release')) && '1' || '' }}

    steps:
    - uses: actions/checkout@v7

    # The languages' package downloads (Maven, npm, Go modules, NuGet, pub,
    # pip, LuaRocks), kept between runs so CI rarely hits the registries: a
    # registry rate limit (Maven Central's 429) otherwise fails every schema.
    # The build tests and interop.sh also retry a registry failure, then report
    # it as a warning rather than a failure.
    - uses: actions/cache@v6
      with:
        path: |
          ~/.m2/repository
          ~/.npm
          ~/go/pkg/mod
          ~/.nuget/packages
          ~/.pub-cache
          ~/.cache/pip
          ~/.luarocks
        key: deps-${{ runner.os }}-${{ matrix.lang }}-${{ hashFiles('crates/backend-*/src/**/*.rs') }}
        restore-keys: |
          deps-${{ runner.os }}-${{ matrix.lang }}-

    - if: matrix.lang == 'csharp'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'
    - if: matrix.lang == 'nodejs'
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - if: matrix.lang == 'python'
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - if: matrix.lang == 'python'
      run: pip install 'cbor2>=6.0' pytest
    - if: matrix.lang == 'go'
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'
        # The generated modules aren't in the repository (no go.sum to key
        # on); the cache step above keeps ~/go/pkg/mod.
        cache: false
    - if: matrix.lang == 'java'
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'
    - if: matrix.lang == 'lua'
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
        luarocks --lua-version 5.4 --local install busted
    - if: matrix.lang == 'dart'
      uses: dart-lang/setup-dart@v1

    - name: Build
      run: cargo build
    - name: Build tests
      run: cargo test -p backend-buildtest --test build_validation -- --ignored --exact --nocapture ${{ matrix.tests }}
    - name: Interop vectors
      # The Rust-encoded vectors, decoded and re-encoded byte for byte by each
      # language (no Dart harness yet).
      if: matrix.lang != 'dart'
      run: scripts/interop.sh ${{ matrix.lang }}
