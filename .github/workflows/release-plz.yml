# On every push to main, release-plz releases if the push is a merged release PR (a
# release-plz-* branch; release_always = false): the tag, the GitHub release and its static
# musl binary. Nothing goes to crates.io (release-plz.toml). Release PRs are opened with
# `scripts/release.sh pr`, never from here: that would need the repository setting that
# lets Actions create and approve pull requests, which this project leaves off.
name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    if: ${{ github.repository_owner == 'dgtlrift' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        # v0.5.148, with release-plz 0.4.3: the first release whose musl build parses a
        # changelog again (release-plz/release-plz#3299, fixed in #3301).
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b
        with:
          command: release
          version: 0.4.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the static binary
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        # The tag release-plz just pushed isn't in this checkout yet: fetch it by name.
        run: |
          tag="$(printf '%s' "$RELEASES" | jq -r '.[0].tag')"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git checkout "$tag"
          GIT_TOKEN="$GITHUB_TOKEN" scripts/release.sh binary
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
