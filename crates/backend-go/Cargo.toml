[package]
name        = "backend-go"
version     = { workspace = true }
edition     = "2021"
description = "Go code-generation backend for cddlc (fxamacker/cbor runtime)"
license     = "MIT OR Apache-2.0"

[lib]
name = "backend_go"
path = "src/lib.rs"

[dependencies]
cddlc-ir      = { path = "../cddlc-ir" }
cddlc-codegen = { path = "../cddlc-codegen" }

[dev-dependencies]
cddlc-parser  = { path = "../cddlc-parser" }
