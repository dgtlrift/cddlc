[package]
name        = "backend-lua"
version     = { workspace = true }
edition     = "2021"
description = "Lua 5.3+ code-generation backend for cddlc (self-contained CBOR/JSON codec)"
license     = "MIT OR Apache-2.0"

[lib]
name = "backend_lua"
path = "src/lib.rs"

[dependencies]
cddlc-ir      = { path = "../cddlc-ir" }
cddlc-codegen = { path = "../cddlc-codegen" }

[dev-dependencies]
cddlc-parser  = { path = "../cddlc-parser" }
